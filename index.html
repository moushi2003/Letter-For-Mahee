<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Letter Day 🤍</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="letter-intro-page">


    <div class="overlay"></div>


    <div class="intro-content">


        <h1>
            Happy Letter Day ♡
        </h1>


        <div class="line">♡</div>


        <p>
            এই বিশেষ দিনটাকে স্মরণীয় করে রাখতে,<br>
            তোর জন্য একটা ছোট্ট চিঠি রেখে গেলাম... ♡
        </p>



        <div class="envelope-container" onclick="openLetter()">



            <div class="envelope">


                <div class="top-flap"></div>


                <div class="letter-paper">

                    <h2>
                        মাহির জন্য ♡
                    </h2>

                </div>



                <div class="wax-seal">

                    ♡

                </div>



            </div>



        </div>



        <p class="click-text">

            চিঠিটা পড়তে এখানে ক্লিক কর ♡

        </p>



        <div class="dots">

            ● ○

        </div>



    </div>


</div>



<script>

function openLetter(){

    document.querySelector(".envelope-container")
    .style.transform="scale(1.1)";


    setTimeout(()=>{

        window.location.href="letter.html";

    },700);


}


</script>



</body>

</html>
