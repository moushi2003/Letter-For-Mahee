<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter For Mahee 🤍</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="date">
            <h1>চিঠি দিবস 🤍</h1>
            <p>১ সেপ্টেম্বর ২০২৬</p>
            <p>September 1, 2026</p>
        </div>


        <div class="intro">
            <p>
                এই বিশেষ দিনটাকে স্মরণীয় করে রাখতে,<br>
                তোর জন্য একটা ছোট্ট চিঠি...
            </p>
        </div>


        <div class="envelope" onclick="openLetter()">

            <div class="flap"></div>

            <div class="paper">
                <h2>মাহির জন্য 🤍</h2>
            </div>

            <div class="seal">
                ❤️
            </div>

        </div>


        <p class="click">
            ✨ Click the envelope ✨
        </p>

    </div>


<script src="script.js"></script>

</body>
</html>
