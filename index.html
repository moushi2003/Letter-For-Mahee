<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Mahee ❤️</title>

    <!-- ================= GOOGLE FONTS ================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Dancing+Script:wght@600&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;600;800&display=swap"
        rel="stylesheet">

    <!-- ================= MAIN CSS ================= -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- =====================================================
         1. MARVEL CINEMATIC SPIDER-MAN INTRO
    ====================================================== -->

    <section class="scene" id="spiderScene">

        <!-- ================= BACKGROUND CANVAS ================= -->
        <canvas id="webCanvas"></canvas>


        <!-- ================= CINEMATIC BACKGROUND ================= -->

        <div class="hero-bg"></div>

        <div class="hero-overlay"></div>

        <div class="hero-gradient"></div>


        <!-- ================= FOG ================= -->

        <div class="fog-container">

            <div class="fog fog1"></div>
            <div class="fog fog2"></div>
            <div class="fog fog3"></div>

        </div>


        <!-- ================= LIGHT RAYS ================= -->

        <div class="light-rays">

            <span class="ray ray1"></span>
            <span class="ray ray2"></span>
            <span class="ray ray3"></span>

        </div>


        <!-- ================= FLOATING DUST ================= -->

        <div class="dust-container">

            <span class="dust d1"></span>
            <span class="dust d2"></span>
            <span class="dust d3"></span>
            <span class="dust d4"></span>
            <span class="dust d5"></span>

            <span class="dust d6"></span>
            <span class="dust d7"></span>
            <span class="dust d8"></span>
            <span class="dust d9"></span>
            <span class="dust d10"></span>

        </div>


        <!-- ================= STARS ================= -->

        <div class="stars-layer">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- ================= LIGHTNING ================= -->

        <div class="lightning-wrapper">

            <div class="lightning lightning-left"></div>
            <div class="lightning lightning-right"></div>

        </div>


        <!-- ================= SPIDER GLOW ================= -->

        <div class="spider-glow"></div>


        <!-- =================================================
             CAMERA WRAPPER
        ================================================== -->

        <div class="camera-wrapper">


            <!-- =================================================
                 SPIDER-MAN #1
                 RIGHT SIDE ENTRANCE
            ================================================== -->

            <div class="spiderman-entry right-spider">

                <div class="main-web-line"></div>

                <div class="web-shadow"></div>


                <div class="spiderman-side-container">

                    <div class="spiderman-body">

                        <!-- HEAD -->

                        <div class="spider-head">

                            <div class="mask-pattern"></div>

                            <div class="eye-3d left">
                                <span class="eye-glow"></span>
                            </div>

                            <div class="eye-3d right">
                                <span class="eye-glow"></span>
                            </div>

                        </div>


                        <!-- NECK -->

                        <div class="spider-neck"></div>


                        <!-- TORSO -->

                        <div class="spider-torso">

                            <div class="torso-pattern"></div>

                            <div class="spider-logo">
                                🕷️
                            </div>

                        </div>


                        <!-- ARMS -->

                        <div class="left-arm"></div>
                        <div class="right-arm"></div>


                        <!-- LEGS -->

                        <div class="left-leg"></div>
                        <div class="right-leg"></div>

                    </div>

                </div>

            </div>



            <!-- =================================================
                 SPIDER-MAN #2
                 MAIN SPIDER ENTRANCE
            ================================================== -->

            <div class="spiderman-entry">

                <div class="main-web-line"></div>

                <div class="web-shadow"></div>


                <div class="spiderman-side-container">

                    <div class="spiderman-body">

                        <!-- HEAD -->

                        <div class="spider-head">

                            <div class="mask-pattern"></div>

                            <div class="eye-3d left">
                                <span class="eye-glow"></span>
                            </div>

                            <div class="eye-3d right">
                                <span class="eye-glow"></span>
                            </div>

                        </div>


                        <!-- NECK -->

                        <div class="spider-neck"></div>


                        <!-- TORSO -->

                        <div class="spider-torso">

                            <div class="torso-pattern"></div>

                            <div class="spider-logo">
                                🕷️
                            </div>

                        </div>


                        <!-- ARMS -->

                        <div class="left-arm"></div>
                        <div class="right-arm"></div>


                        <!-- LEGS -->

                        <div class="left-leg"></div>
                        <div class="right-leg"></div>

                    </div>

                </div>

            </div>



            <!-- =================================================
                 HERO CONTENT
            ================================================== -->

            <div class="hero-content">

                <div class="glass-card">

                    <!-- SPECIAL BADGE -->

                    <span class="badge">
                        ✦ SPECIAL DAY ✦
                    </span>


                    <!-- MAIN TITLE -->

                    <div class="title-wrapper">

                        <h1 class="glow-title">
                            Happiest Birthday
                        </h1>

                        <div class="title-light"></div>

                    </div>


                    <!-- HERO SUBTITLE -->

                    <h2 class="hero-name">
                        MY SPIDER MAN
                    </h2>


                    <!-- PERSON NAME -->

                    <h3 class="person-name">
                        Mahee ❤️
                    </h3>


                    <!-- DIVIDER -->

                    <div class="divider"></div>


                    <!-- TYPEWRITER MESSAGE -->

                    <p id="typing" class="typing-text"></p>


                    <!-- HERO QUOTE -->

                    <div class="hero-quote">

                        <span class="quote-line"></span>

                        <p>
                            "Every hero has a story... Today is yours."
                        </p>

                        <span class="quote-line"></span>

                    </div>


                    <!-- HERO BUTTONS -->

                    <div class="hero-actions">

                        <button
                            id="musicBtn"
                            class="hero-btn primary-btn"
                            type="button">

                            <span class="btn-icon">
                                🎵
                            </span>

                            <span>
                                Play Music
                            </span>

                        </button>


                        <button
                            id="enterBtn"
                            class="hero-btn secondary-btn"
                            type="button">

                            <span>
                                Begin Journey
                            </span>

                            <span class="arrow">
                                ➜
                            </span>

                        </button>

                    </div>

                </div>

            </div>



            <!-- =================================================
                 SCROLL INDICATOR
            ================================================== -->

            <div class="scroll-indicator">

                <span class="mouse">
                    <span class="wheel"></span>
                </span>

                <p>
                    Scroll Down
                </p>

            </div>


        </div>



        <!-- =================================================
             CORNER WEBS
        ================================================== -->

        <div class="corner-web top-left"></div>
        <div class="corner-web top-right"></div>

        <div class="corner-web bottom-left"></div>
        <div class="corner-web bottom-right"></div>



        <!-- =================================================
             PARTICLES
        ================================================== -->

        <div class="particle-container">

            <span class="particle p1"></span>
            <span class="particle p2"></span>
            <span class="particle p3"></span>
            <span class="particle p4"></span>

            <span class="particle p5"></span>
            <span class="particle p6"></span>
            <span class="particle p7"></span>
            <span class="particle p8"></span>

            <span class="particle p9"></span>
            <span class="particle p10"></span>
            <span class="particle p11"></span>
            <span class="particle p12"></span>

        </div>



        <!-- =================================================
             SCREEN FLASH
        ================================================== -->

        <div class="screen-flash"></div>



        <!-- =================================================
             HERO TRANSITION
        ================================================== -->

        <div class="hero-transition">

            <div class="transition-glow"></div>

            <div class="transition-web"></div>

            <div class="transition-fade"></div>

        </div>

    </section>



    <!-- =====================================================
         AUDIO
    ====================================================== -->

    <audio id="music" loop preload="auto">
        <source src="spiderman.mp3" type="audio/mpeg">
    </audio>

    <audio id="thunderSound" preload="auto">
        <source src="thunder.mp3" type="audio/mpeg">
    </audio>

    <audio id="webShootSound" preload="auto">
        <source src="webshoot.mp3" type="audio/mpeg">
    </audio>

    <audio id="whooshSound" preload="auto">
        <source src="whoosh.mp3" type="audio/mpeg">
    </audio>

    <audio id="sparkleSound" preload="auto">
        <source src="sparkle.mp3" type="audio/mpeg">
    </audio>
